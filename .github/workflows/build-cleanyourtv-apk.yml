name: Build CleanYourTV Launcher APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cleanyourtv-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Checkout original CleanYourTV v3.2.0
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: v3.2.0
          path: cleanyourtv-source
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build release APK (no TV modifications)
        working-directory: cleanyourtv-source/launcher
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK="cleanyourtv-source/launcher/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          mkdir -p output
          cp "$APK" output/CleanYourTV-v3.2.0-launcher.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-v3.2.0-launcher-APK
          path: output/*.apk
          if-no-files-found: error
