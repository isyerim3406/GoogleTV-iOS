name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify application entry point
        run: |
          test -f Sources/GoogleTVToolsApp.swift
          grep -q '@main' Sources/GoogleTVToolsApp.swift
          ls -la Sources
      - name: Generate project
        run: xcodegen generate
      - name: Build for iPhone
        run: |
          xcodebuild -project GoogleTVTools.xcodeproj -scheme GoogleTVTools -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GoogleTVTools.app Payload/
          zip -qry GoogleTVTools-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GoogleTVTools-unsigned-ipa
          path: GoogleTVTools-unsigned.ipa
